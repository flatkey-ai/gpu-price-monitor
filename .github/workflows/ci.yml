name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install collection library
        run: python -m pip install -e .
      - name: Check Python syntax
        run: python -m compileall -q src
      - name: Check project status
        run: PYTHONPATH=src python -m gpu_price_monitor status
      - name: Validate collection configuration example
        run: PYTHONPATH=src python -m gpu_price_monitor validate-config --config configs/collect.example.json
      - name: Validate all public source configurations
        run: |
          PYTHONPATH=src python -m gpu_price_monitor validate-config --config configs/collect.free.example.json
          PYTHONPATH=src python -m gpu_price_monitor validate-config --config configs/collect.all.example.json
      - name: Validate standalone five-provider API-preferred profile
        run: PYTHONPATH=src python -m gpu_price_monitor status --env-file .env.five.example
      - name: Validate anonymous RunPod configuration
        run: |
          PYTHONPATH=src python -m gpu_price_monitor status --env-file .env.runpod.example
          PYTHONPATH=src python -m gpu_price_monitor validate-config --config configs/collect.runpod.example.json
      - name: Check environment configuration and collection boundary
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Validate anonymous Vast configuration
        run: |
          PYTHONPATH=src python -m gpu_price_monitor status --env-file .env.vast.example
          PYTHONPATH=src python -m gpu_price_monitor validate-config --config configs/collect.vast.example.json
