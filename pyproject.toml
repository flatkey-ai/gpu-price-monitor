[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flatkey-gpu-price-monitor"
version = "0.21.0"
description = "GPU cloud price collection library with Python, JSON and CSV interfaces"
readme = "README.en.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["beautifulsoup4>=4.12,<5", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
browser = ["playwright>=1.49,<2"]

[project.scripts]
gpu-price-monitor = "gpu_price_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
